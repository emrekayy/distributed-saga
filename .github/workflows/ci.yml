name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Aynı ref'te yeni push eski koşuyu iptal eder.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build:
    name: Build and format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # Hedef net9.0; SDK 10 ile derlenir (global.json rollForward: latestMajor), yerel ortamla aynı.
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj
      - run: dotnet restore DistributedSaga.sln
      - run: dotnet build DistributedSaga.sln --no-restore -v q -clp:ErrorsOnly
      - run: dotnet format DistributedSaga.sln --no-restore --verify-no-changes

  unit-tests:
    name: Unit tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj
      - run: >
          dotnet test DistributedSaga.sln -v q
          --filter "Category!=Integration"
          --logger "trx;LogFileName=unit.trx"
          --results-directory TestResults/unit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: unit-test-results
          path: TestResults/unit/**/*.trx
          if-no-files-found: warn

  integration-tests:
    name: Integration tests (Testcontainers)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj
      # ubuntu runner'da Docker hazır; Testcontainers Postgres 17 + RabbitMQ 4.1'i kendisi başlatır.
      - run: >
          dotnet test tests/IntegrationTests -v q
          --filter "Category=Integration"
          --logger "trx;LogFileName=integration.trx"
          --results-directory TestResults/integration
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: integration-test-results
          path: TestResults/integration/**/*.trx
          if-no-files-found: warn

  docker-build:
    name: Docker image (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ordering-api
            dockerfile: src/Services/Ordering/Ordering.API/Dockerfile
          - image: inventory-api
            dockerfile: src/Services/Inventory/Inventory.API/Dockerfile
          - image: payments-api
            dockerfile: src/Services/Payments/Payments.API/Dockerfile
          - image: migrator
            dockerfile: deploy/migrator/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Yalnızca build: registry'ye push YOK.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: saga/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
