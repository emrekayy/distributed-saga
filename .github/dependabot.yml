version: 2

updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      opentelemetry:
        patterns: ["OpenTelemetry*"]
      testing:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "coverlet*", "Testcontainers*"]
    ignore:
      # LİSANS: MassTransit v9 ticaridir; proje v8 (Apache 2.0) hattında kalır (ADR-002). v9+ asla önerilmesin.
      - dependency-name: "MassTransit*"
        versions: [">=9.0.0"]
      # Hedef framework net9.0: bu paket aileleri major'larını .NET sürümüyle birlikte çıkarır (10.x paketleri net10.0 ister).
      # .NET 10'a geçiş ayrı ve bilinçli bir karardır (TargetFramework, SDK/runtime imajları, bu kurallar birlikte değişir);
      # o zamana kadar yalnızca minor/patch önerilir.
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      # MassTransit.Quartz 8.x, Quartz'ı [3.22, 4.0) aralığıyla sınırlar (NU1608); Quartz 4.x ancak MassTransit hattı
      # değişince mümkündür ve o da v9 (ticari, ADR-002) demektir. Bu yüzden Quartz major'ları önerilmez.
      - dependency-name: "Quartz*"
        update-types: ["version-update:semver-major"]
      # dotnet-tools.json: dotnet-ef EF Core 9 ile aynı hatta kalır.
      - dependency-name: "dotnet-ef"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # Dockerfile'lar (taban imajlar: sdk / aspnet / runtime-deps). Hedef net9.0 olduğu için .NET imajlarının major
  # güncellemesi (10.x) önerilmesin; .NET 10'a geçiş ayrı bir karardır.
  - package-ecosystem: docker
    directories:
      - "/src/Services/Ordering/Ordering.API"
      - "/src/Services/Inventory/Inventory.API"
      - "/src/Services/Payments/Payments.API"
      - "/deploy/migrator"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/aspnet"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/runtime-deps"
        update-types: ["version-update:semver-major"]

  # docker-compose.yml imajları (postgres, rabbitmq, pgadmin, jaeger, prometheus).
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # Postgres/RabbitMQ major yükseltmesi veri/şema göçü gerektirir; bilinçli yapılır.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rabbitmq"
        update-types: ["version-update:semver-major"]
