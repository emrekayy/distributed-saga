# =============================================================================
#  Distributed Saga - Altyapı (Adım 1)
#  Kullanım:
#    cp .env.example .env
#    docker compose up -d                  # postgres + rabbitmq
#    docker compose --profile tools up -d  # + pgAdmin
#    docker compose --profile app up -d --build   # her şey: postgres, rabbitmq, migrator, 3 API
#  "app" profilindeki API'ler Production ortamında koşar (startup'ta migration YOK; migrator servisi uygular).
#  Demo bayrakları (Seed, InternalEndpoints) burada bilerek açıktır; Production varsayılanı kapalıdır.
# =============================================================================
name: distributed-saga

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-common: &api-common
  profiles: ["app"]
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    migrator:
      condition: service_completed_successfully
  logging: *default-logging
  networks:
    - saga-net

x-api-env: &api-env
  ASPNETCORE_ENVIRONMENT: Production
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_AMQP_PORT: "5672"
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-saga}
  RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER tanımlı değil}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD tanımlı değil}
  # OpenTelemetry: trace -> Jaeger, metrik -> Prometheus (ikisi "observability" profilinde). Profil kapalıyken adresler
  # çözümlenemez; exporter hatayı sessizce yutar, uygulama etkilenmez.
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_METRICS_ENDPOINT:-http://prometheus:9090/api/v1/otlp/v1/metrics}
  OTEL_METRIC_EXPORT_INTERVAL: "15000"
  # DEMO: Production varsayılanı ikisi de kapalı; compose demosunda bilerek açık (e2e ve "siparişi izle" için).
  Seed__Enabled: "true"
  InternalEndpoints__Enabled: "true"

x-api-health: &api-health
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 20s

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL: Tek instance, servis başına AYRI veritabanı + AYRI kullanıcı.
  # Her servis yalnızca kendi DB'sine yetkili (least privilege). Database-per-
  # Service sınırı mantıksal olarak korunur; canlıda her DB ayrı instance /
  # managed service'e taşınabilir, connection string dışında kod değişmez.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17.11-alpine
    container_name: saga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER tanımlı değil}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD tanımlı değil}
      POSTGRES_DB: postgres
      # init script'i tarafından okunur (deploy/postgres/init)
      ORDER_DB_NAME: ${ORDER_DB_NAME:-order_db}
      ORDER_DB_USER: ${ORDER_DB_USER:-order_svc}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?ORDER_DB_PASSWORD tanımlı değil}
      STOCK_DB_NAME: ${STOCK_DB_NAME:-stock_db}
      STOCK_DB_USER: ${STOCK_DB_USER:-stock_svc}
      STOCK_DB_PASSWORD: ${STOCK_DB_PASSWORD:?STOCK_DB_PASSWORD tanımlı değil}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME:-payment_db}
      PAYMENT_DB_USER: ${PAYMENT_DB_USER:-payment_svc}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?PAYMENT_DB_PASSWORD tanımlı değil}
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - log_min_duration_statement=500   # 500ms üzeri sorguları logla
      - -c
      - log_lock_waits=on                # concurrency sorunlarını görünür kıl
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging
    networks:
      - saga-net

  # ---------------------------------------------------------------------------
  # RabbitMQ (management UI: http://localhost:15672)
  # hostname sabit: RabbitMQ veri dizinini node adına göre tutar; hostname
  # değişirse volume'daki kuyruklar "kaybolmuş" gibi görünür.
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    container_name: saga-rabbitmq
    hostname: saga-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER tanımlı değil}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD tanımlı değil}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-saga}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
      - "${RABBITMQ_PROMETHEUS_PORT:-15692}:15692"   # rabbitmq_prometheus plugin (kuyruk metrikleri, _error dahil)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # + shovel: _error kuyruğundaki mesajları elle geri taşımak için ("Move messages", README: _error queues)
      - ./deploy/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks:
      - saga-net

  # ---------------------------------------------------------------------------
  # pgAdmin (opsiyonel): docker compose --profile tools up -d
  # http://localhost:5050
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:9.18.0
    container_name: saga-pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@saga.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD tanımlı değil}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    networks:
      - saga-net

  # ---------------------------------------------------------------------------
  # "app" profili. Sıra: postgres + rabbitmq (healthy) -> migrator (bir kez çalışıp çıkar) -> 3 API.
  # Healthcheck: image shell'siz/curl'süz (chiseled) olduğu için uygulamanın kendi "--health-probe" argümanı.
  # ---------------------------------------------------------------------------
  migrator:
    image: saga/migrator:local
    build:
      context: .
      dockerfile: deploy/migrator/Dockerfile
    profiles: ["app"]
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      ORDER_DB_NAME: ${ORDER_DB_NAME:-order_db}
      ORDER_DB_USER: ${ORDER_DB_USER:-order_svc}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?ORDER_DB_PASSWORD tanımlı değil}
      STOCK_DB_NAME: ${STOCK_DB_NAME:-stock_db}
      STOCK_DB_USER: ${STOCK_DB_USER:-stock_svc}
      STOCK_DB_PASSWORD: ${STOCK_DB_PASSWORD:?STOCK_DB_PASSWORD tanımlı değil}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME:-payment_db}
      PAYMENT_DB_USER: ${PAYMENT_DB_USER:-payment_svc}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?PAYMENT_DB_PASSWORD tanımlı değil}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    networks:
      - saga-net

  ordering-api:
    <<: *api-common
    image: saga/ordering-api:local
    build:
      context: .
      dockerfile: src/Services/Ordering/Ordering.API/Dockerfile
    container_name: saga-ordering-api
    environment:
      <<: *api-env
      ORDER_DB_NAME: ${ORDER_DB_NAME:-order_db}
      ORDER_DB_USER: ${ORDER_DB_USER:-order_svc}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?ORDER_DB_PASSWORD tanımlı değil}
      # e2e timeout senaryosu için kısa; gerçek varsayılan 00:00:30 (appsettings.json).
      OrderSaga__PaymentTimeout: ${ORDER_PAYMENT_TIMEOUT:-00:00:10}
    ports:
      - "${ORDERING_PORT:-5100}:8080"
    healthcheck:
      test: ["CMD", "dotnet", "Ordering.API.dll", "--health-probe", "http://localhost:8080/health/ready"]
      <<: *api-health

  inventory-api:
    <<: *api-common
    image: saga/inventory-api:local
    build:
      context: .
      dockerfile: src/Services/Inventory/Inventory.API/Dockerfile
    container_name: saga-inventory-api
    environment:
      <<: *api-env
      STOCK_DB_NAME: ${STOCK_DB_NAME:-stock_db}
      STOCK_DB_USER: ${STOCK_DB_USER:-stock_svc}
      STOCK_DB_PASSWORD: ${STOCK_DB_PASSWORD:?STOCK_DB_PASSWORD tanımlı değil}
    ports:
      - "${INVENTORY_PORT:-5200}:8080"
    healthcheck:
      test: ["CMD", "dotnet", "Inventory.API.dll", "--health-probe", "http://localhost:8080/health/ready"]
      <<: *api-health

  payments-api:
    <<: *api-common
    image: saga/payments-api:local
    build:
      context: .
      dockerfile: src/Services/Payments/Payments.API/Dockerfile
    container_name: saga-payments-api
    environment:
      <<: *api-env
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME:-payment_db}
      PAYMENT_DB_USER: ${PAYMENT_DB_USER:-payment_svc}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?PAYMENT_DB_PASSWORD tanımlı değil}
      # Hata enjeksiyonu compose'da KAPALI kalır (yalnızca Development/Testing'de izinli).
      FaultInjection__Enabled: "false"
    ports:
      - "${PAYMENTS_PORT:-5300}:8080"
    healthcheck:
      test: ["CMD", "dotnet", "Payments.API.dll", "--health-probe", "http://localhost:8080/health/ready"]
      <<: *api-health

  # ---------------------------------------------------------------------------
  # Gözlemlenebilirlik (opsiyonel): docker compose --profile app --profile observability up -d
  #   Jaeger UI  http://localhost:16686   (trace)
  #   Prometheus http://localhost:9090    (metrik: .NET, MassTransit, RabbitMQ kuyrukları; uyarı kuralları)
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    container_name: saga-jaeger
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"   # dotnet run ile yerelde çalışan servisler için (OTEL_EXPORTER_OTLP_*)
    logging: *default-logging
    networks:
      - saga-net

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: saga-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver       # servisler metrikleri OTLP/HTTP ile gönderir
      - --storage.tsdb.retention.time=2d
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - saga-net

volumes:
  postgres-data:
  prometheus-data:
  rabbitmq-data:
  pgadmin-data:

networks:
  saga-net:
    name: saga-net
    driver: bridge
